name: CI/CD Pipeline for Next.js

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm ci

      - name: eslint Check
        run: npm run lint

      # - name: Build Next.js App
      #   run: npm run build

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build and Push
        id: build-push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/quiz:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/quiz:latest


      - name: Update Kubernetes Deployment Image Tag
        run: |
          sed -i "s|image: amineyousficc/quiz:.*|image: amineyousficc/quiz:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Commit and Push Updated Deployment File
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
        run: |
          git config --global user.name "$GH_USERNAME"
          git config --global user.email "$GH_EMAIL"
          git remote set-url origin https://$GH_USERNAME:$GH_PAT@github.com/${{ github.repository }}.git
          git add k8s/deployment.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update image tag to ${{ github.sha }}" && git push)